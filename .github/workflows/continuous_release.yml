name: Continuous Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_channel:
        description: Shared stable/alpha/beta route or temporary legacy alpha
        required: true
        type: choice
        default: stable
        options: [stable, alpha, beta, legacy-alpha]
      configuration_sha:
        description: Full reviewed Configuration SHA for alpha
        type: string
      jira_sha:
        description: Full reviewed JiraPS SHA for alpha
        type: string
      alpha_version:
        description: Exact major 0 alpha version
        type: string
      release_impact:
        description: Release impact for the changes being packaged
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      major_authorization:
        description: Fresh major authorization as owner/repository vMAJOR
        required: false
        type: string
      prerelease_branch:
        description: Optional source branch for alpha/beta (empty uses master)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || inputs.release_channel != 'legacy-alpha'
    uses: AtlassianPS/AtlassianPS.Standards/.github/workflows/module_release.yml@df1de3e48d5ee30401ecfcbfa7a11118c8d842ac # v0.4.1 + #73
    with:
      module-name: AtlassianPS.Configuration
      release-impact: ${{ inputs.release_impact }}
      release-channel: ${{ inputs.release_channel || 'stable' }}
      prerelease-branch: ${{ inputs.prerelease_branch }}
      major-authorization: ${{ inputs.major_authorization }}
    secrets: inherit

  alpha:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.release_channel == 'legacy-alpha'
    uses: ./.github/workflows/alpha_release.yml
    with:
      configuration_sha: ${{ inputs.configuration_sha }}
      jira_sha: ${{ inputs.jira_sha }}
      version: ${{ inputs.alpha_version }}
    secrets: inherit
