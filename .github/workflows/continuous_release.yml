name: Continuous Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_impact:
        description: Release impact for unreleased changes already on master
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: continuous-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: Prepare release metadata
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'Prepare v'))
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || 'master' }}

      - uses: AtlassianPS/AtlassianPS.Standards/.github/actions/plan-merged-release@ee540ecca268608dd5e1957430511ec87f4bc854 # v0.1.14
        id: plan
        with:
          commit-sha: ${{ github.event.workflow_run.head_sha }}
          release-impact: ${{ inputs.release_impact }}

      - uses: AtlassianPS/AtlassianPS.Standards/.github/actions/prepare-release-changelog@ee540ecca268608dd5e1957430511ec87f4bc854 # v0.1.14
        if: steps.plan.outputs.should_release == 'true'
        with:
          release-version: ${{ steps.plan.outputs.release_tag }}

      - uses: AtlassianPS/AtlassianPS.Standards/.github/actions/setup-powershell@ee540ecca268608dd5e1957430511ec87f4bc854 # v0.1.14
        if: steps.plan.outputs.should_release == 'true'

      - name: Stamp source manifest version
        if: steps.plan.outputs.should_release == 'true'
        run: Invoke-Build -Task SetSourceVersion -VersionToPublish ${{ steps.plan.outputs.release_tag }}
        shell: pwsh

      - name: Create release app token
        if: steps.plan.outputs.should_release == 'true'
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ATLASSIANPS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ATLASSIANPS_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AtlassianPS.Configuration

      - uses: AtlassianPS/AtlassianPS.Standards/.github/actions/commit-release-metadata@ee540ecca268608dd5e1957430511ec87f4bc854 # v0.1.14
        if: steps.plan.outputs.should_release == 'true'
        with:
          release-tag: ${{ steps.plan.outputs.release_tag }}
          manifest-path: AtlassianPS.Configuration/AtlassianPS.Configuration.psd1
          release-bot-token: ${{ steps.release_app.outputs.token }}

  publish:
    name: Publish tested release artifact
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Prepare v') &&
      github.event.workflow_run.head_commit.author.name == 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve prepared release
        id: prepared_release
        shell: pwsh
        env:
          PREPARED_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          $message = $env:PREPARED_COMMIT_MESSAGE
          if ($message -notmatch '^Prepare (?<tag>v\d+\.\d+\.\d+) release$') {
            throw "Commit message '$message' is not a release metadata commit."
          }

          "release_tag=$($Matches.tag)" >> $env:GITHUB_OUTPUT

      - name: Download tested release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: Release
          path: ./Release/
          digest-mismatch: error

      - name: Create release app token
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ATLASSIANPS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ATLASSIANPS_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AtlassianPS.Configuration

      - name: Create annotated release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_TAG: ${{ steps.prepared_release.outputs.release_tag }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $refs = @(gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:RELEASE_TAG" | ConvertFrom-Json)
          $existing = $refs | Where-Object { $_.ref -eq "refs/tags/$env:RELEASE_TAG" } | Select-Object -First 1
          if ($existing) {
            if ($existing.object.type -ne 'tag') {
              throw "Release tag '$env:RELEASE_TAG' must be annotated."
            }
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($existing.object.sha)" | ConvertFrom-Json
            if ($tagObject.object.type -ne 'commit' -or $tagObject.object.sha -ne $env:RELEASE_COMMIT) {
              throw "Release tag '$env:RELEASE_TAG' does not identify '$env:RELEASE_COMMIT'."
            }
            Write-Host "Release tag '$env:RELEASE_TAG' already identifies the tested candidate."
            return
          }

          $tagObjectSha = gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/tags" -f tag="$env:RELEASE_TAG" -f message="$env:RELEASE_TAG" -f object="$env:RELEASE_COMMIT" -f type=commit --jq .sha
          gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$env:RELEASE_TAG" -f sha="$tagObjectSha" | Out-Null

      - name: Publish tested module artifact
        env:
          RELEASE_TAG: ${{ steps.prepared_release.outputs.release_tag }}
        run: |
          $expectedGalleryVersion = $env:RELEASE_TAG.Substring(1)
          $published = Find-Module -Name 'AtlassianPS.Configuration' -RequiredVersion $expectedGalleryVersion -Repository PSGallery -ErrorAction SilentlyContinue
          if ($published) {
            Write-Host "PSGallery already contains AtlassianPS.Configuration $expectedGalleryVersion; skipping immutable publish."
            return
          }
          Publish-Module -Path ./Release/AtlassianPS.Configuration -Repository PSGallery -NuGetApiKey ${{ secrets.PSGALLERY_API_KEY }} -ErrorAction Stop
        shell: pwsh

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          token: ${{ steps.release_app.outputs.token }}
          tag_name: ${{ steps.prepared_release.outputs.release_tag }}
          body_path: ./Release/release-notes.md
          files: ./Release/AtlassianPS.Configuration.zip
          fail_on_unmatched_files: true

      - name: Notify homepage to update submodule
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMEPAGE_PAT }}
          repository: AtlassianPS/AtlassianPS.github.io
          event-type: module-release
          client-payload: >-
            {"module":"AtlassianPS.Configuration","version":"${{ steps.prepared_release.outputs.release_tag }}"}
